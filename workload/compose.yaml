name: report-workshop
x-app: &app
  build:
    context: .
    args:
      REVISION: ${APP_REVISION:-development}
  environment:
    DATABASE_URL: postgres://workshop:local-demo-only@db:5432/workshop?sslmode=disable
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: workshop
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workshop -d workshop]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://workshop:local-demo-only@db:5432/workshop?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      METRICS_ADDR: 0.0.0.0:9090
    command: [api]
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:19090:9090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    environment:
      DATABASE_URL: postgres://workshop:local-demo-only@db:5432/workshop?sslmode=disable
      METRICS_ADDR: 0.0.0.0:9090
    ports: ["127.0.0.1:19091:9090"]
    command: [worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./telemetry/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    tmpfs: ["/prometheus:uid=65534,gid=65534"]
    ports: ["127.0.0.1:19092:9090"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
volumes:
  database:
