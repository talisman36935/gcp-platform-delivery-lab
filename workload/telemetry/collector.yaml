receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 200ms
    send_batch_size: 128
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  file:
    path: /data/traces.json
    format: json
    flush_interval: 200ms
    rotation:
      max_megabytes: 10
      max_backups: 1
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, file]
